# Metadados do serviço (seção 9.7). Validado por ci/schemas/service.schema.json
# do saci-boiuna e pelas políticas de classe de dado.
name: reviews-api
domain: reviews
owner: saci-art/commerce
language: rust
runtime: aws-lambda
account: prod
# Funções (SACI_FUNCTION) do binário saci-reviews que pertencem a este serviço (ADR 0003).
routes:
  - route: GET /v1/reviews/storefronts/{url_name}
    access: PUB
  - route: POST /v1/reviews/me/reviews
    access: USER
data:
  stores:
    - name: saci-<env>-reviews
      kind: dynamodb
      class: C2
      kms_key_class: C2
logging:
  request_body: false
events:
  publishes: []
  consumes: []
slo:
  availability: 99.9
  latency_p99_ms: 300
