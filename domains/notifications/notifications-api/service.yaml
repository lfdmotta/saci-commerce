# Metadados do serviço (seção 9.7). Validado por ci/schemas/service.schema.json
# do saci-boiuna e pelas políticas de classe de dado.
name: notifications-api
domain: notifications
owner: saci-art/commerce
language: rust
runtime: aws-lambda
account: prod
# Funções (SACI_FUNCTION) do binário saci-notifications que pertencem a este serviço (ADR 0003).
routes:
  - route: PUT /v1/notifications/me/devices/{installation_id}
    access: USER
  - route: DELETE /v1/notifications/me/devices/{installation_id}
    access: USER
  - route: GET /v1/notifications/me/preferences
    access: USER
  - route: PUT /v1/notifications/me/preferences
    access: USER
data:
  stores:
    - name: saci-<env>-notifications
      kind: dynamodb
      class: C2
      kms_key_class: C2
logging:
  request_body: false
events:
  publishes: []
  consumes: []
slo:
  availability: 99.9
  latency_p99_ms: 300
