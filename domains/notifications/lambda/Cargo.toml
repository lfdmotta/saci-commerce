[package]
name = "saci-notifications-lambda"
version = "0.1.0"
description = "Binário implantável do domínio notifications: um ZIP para todas as funções do domínio, cada uma escolhida por SACI_FUNCTION (ADR 0003)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# cargo lambda build gera target/lambda/saci-notifications/bootstrap.zip.
name = "saci-notifications"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
lambda_runtime.workspace = true
saci-commerce-kit = { workspace = true, features = ["aws"] }
saci-commerce-sandbox = { workspace = true, features = ["aws"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
aws-sdk-sqs.workspace = true
aws_lambda_events.workspace = true
serde.workspace = true
saci-notifications-api = { workspace = true, features = ["aws"] }
saci-notifications-dispatcher = { workspace = true, features = ["aws"] }

[lints]
workspace = true
