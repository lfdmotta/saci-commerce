# Metadados do serviço (seção 9.7). Validado por ci/schemas/service.schema.json
# do saci-boiuna e pelas políticas de classe de dado.
name: support-api
domain: support
owner: saci-art/commerce
language: rust
runtime: aws-lambda
account: prod
# Funções (SACI_FUNCTION) do binário saci-support que pertencem a este serviço (ADR 0003).
routes:
  - route: GET /v1/support/me/tickets
    access: USER
  - route: GET /v1/support/me/tickets/{protocol}
    access: USER
  - route: POST /v1/support/me/tickets/{protocol}/messages
    access: USER
  - route: POST /v1/support/me/tickets/{protocol}/resolve
    access: USER
data:
  stores:
    - name: saci-<env>-support
      kind: dynamodb
      class: C2
      kms_key_class: C2
logging:
  request_body: false
events:
  publishes:
    - support.ticket.opened.v1
    - support.ticket.message_added.v1
    - support.ticket.resolved.v1
  consumes:
    - assistant.handoff.requested.v1
slo:
  availability: 99.9
  latency_p99_ms: 300
