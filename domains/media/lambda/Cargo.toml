[package]
name = "saci-media-lambda"
version = "0.1.0"
description = "Binário implantável do domínio media: um ZIP para todas as funções do domínio, cada uma escolhida por SACI_FUNCTION (ADR 0003)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# cargo lambda build gera target/lambda/saci-media/bootstrap.zip.
name = "saci-media"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
lambda_runtime.workspace = true
saci-commerce-kit = { workspace = true, features = ["aws"] }
saci-commerce-sandbox = { workspace = true, features = ["aws"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
aws_lambda_events.workspace = true
saci-media-api = { workspace = true, features = ["aws"] }
saci-media-pipeline = { workspace = true, features = ["aws"] }

[lints]
workspace = true
