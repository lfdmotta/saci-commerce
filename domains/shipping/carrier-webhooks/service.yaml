# Metadados do serviço (seção 9.7). Validado por ci/schemas/service.schema.json
# do saci-boiuna e pelas políticas de classe de dado.
name: carrier-webhooks
domain: shipping
owner: saci-art/commerce
language: rust
runtime: aws-lambda
account: prod
# Funções (SACI_FUNCTION) do binário saci-shipping que pertencem a este serviço (ADR 0003).
routes: []
data:
  stores:
    - name: saci-<env>-shipping
      kind: dynamodb
      class: C1
      kms_key_class: C2
logging:
  request_body: false
events:
  publishes:
    - shipping.tracking.updated.v1
  consumes: []
slo:
  availability: 99.9
  latency_p99_ms: 300
