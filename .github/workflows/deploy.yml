    uses: saci-art/saci-boiuna/.github/workflows/reusable-deploy-service.yml@v1
    with:
      github-environment: customers-prod
      saci-environment: prod
      service: customers
      lambda-bin: saci-customers
      infra-dir: domains/customers/infra/aws
      platform-ref: v1

  reviews-prod:
    needs: [customers-prod, reviews-dev]
    uses: saci-art/saci-boiuna/.github/workflows/reusable-deploy-service.yml@v1
    with:
      github-environment: reviews-prod
      saci-environment: prod
      service: reviews
      lambda-bin: saci-reviews
      infra-dir: domains/reviews/infra/aws
