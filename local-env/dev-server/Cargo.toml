[package]
name = "saci-commerce-dev"
version = "0.1.0"
description = "Servidor de desenvolvimento: todos os serviços do saci-commerce num processo, com o mesmo código das Lambdas, para a interface testar contra o back-end real na máquina."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "saci-commerce-dev"
path = "src/main.rs"

[dependencies]
base64.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
saci-authz.workspace = true
saci-catalog-api.workspace = true
saci-carrier-webhooks.workspace = true
saci-checkout-saga.workspace = true
saci-commerce-kit.workspace = true
saci-commerce-sandbox.workspace = true
saci-customers-api.workspace = true
saci-ids.workspace = true
saci-media-api.workspace = true
saci-media-pipeline.workspace = true
saci-notifications-api.workspace = true
saci-notifications-dispatcher.workspace = true
saci-orders-api.workspace = true
saci-reviews-api.workspace = true
saci-search-indexer.workspace = true
saci-sellers-api.workspace = true
saci-shipping-api.workspace = true
saci-support-api.workspace = true
saci-telemetry.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }
tracing.workspace = true

[lints]
workspace = true
